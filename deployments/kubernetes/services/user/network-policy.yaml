apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-netpol
  namespace: point-of-sale
spec:
  podSelector:
    matchLabels:
      app: user
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: point-of-sale

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: point-of-sale

