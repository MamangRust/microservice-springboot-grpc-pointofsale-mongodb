apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: point-of-sale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # The official ClickHouse image runs as uid/gid 101; fsGroup 101 lets the
      # process write to the mounted PVC. Do NOT force runAsUser 1000 here.
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_DB
              value: "pos"
            - name: CLICKHOUSE_USER
              value: "dragon"
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-logs
              mountPath: /var/log/clickhouse-server
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: clickhouse
        - name: clickhouse-logs
          emptyDir: {}
