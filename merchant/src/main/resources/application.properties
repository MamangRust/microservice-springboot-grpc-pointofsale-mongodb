spring.application.name=merchant-service
spring.data.mongodb.uri=mongodb://${MERCHANT_DB_HOST:localhost}:${MERCHANT_DB_PORT:27017}/${MERCHANT_DB_NAME:pos_merchant}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9005

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9011}

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Relay mem-publish hanya domain milik service ini; domain lain di database yang
# sama (mis. pos_sales dipakai order + order-item + transaction) ditulis service
# pemiliknya.
outbox.publisher.enabled=true
outbox.publisher.domains=MERCHANT
outbox.publisher.batch-size=50
outbox.publisher.lease-seconds=300
outbox.publisher.max-attempts=5
outbox.publisher.retry-delay-seconds=30
