apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: point-of-sale
data:
  APP_ENV: "kubernetes"
  # MongoDB (satu instance; DB per-context sebagai database terpisah). Tiap
  # microservice membaca <MODULE>_DB_HOST/_PORT/_NAME (Spring:
  # spring.data.mongodb.uri). Instance di database/mongo.yaml.
  # db-migration (Mongock) menarget DB-nya sendiri via DB_MIGRATE_*.
  DB_MIGRATE_HOST: "mongo.point-of-sale.svc.cluster.local"
  DB_MIGRATE_PORT: "27017"
  DB_MIGRATE_NAME: \"pos_identity\"

  ROLE_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  ROLE_DB_PORT: "27017"
  ROLE_DB_NAME: \"pos_identity\"
  USER_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  USER_DB_PORT: "27017"
  USER_DB_NAME: \"pos_identity\"
  AUTH_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  AUTH_DB_PORT: "27017"
  AUTH_DB_NAME: \"pos_identity\"
  MERCHANT_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  MERCHANT_DB_PORT: "27017"
  MERCHANT_DB_NAME: \"pos_merchant\"
  CASHIER_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  CASHIER_DB_PORT: "27017"
  CASHIER_DB_NAME: \"pos_merchant\"
  PRODUCT_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  PRODUCT_DB_PORT: "27017"
  PRODUCT_DB_NAME: \"pos_catalog\"
  CATEGORY_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  CATEGORY_DB_PORT: "27017"
  CATEGORY_DB_NAME: \"pos_catalog\"
  ORDER_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  ORDER_DB_PORT: "27017"
  ORDER_DB_NAME: \"pos_sales\"
  ORDER_ITEM_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  ORDER_ITEM_DB_PORT: "27017"
  ORDER_ITEM_DB_NAME: \"pos_sales\"
  TRANSACTION_DB_HOST: "mongo.point-of-sale.svc.cluster.local"
  TRANSACTION_DB_PORT: "27017"
  TRANSACTION_DB_NAME: \"pos_sales\"
  # GHCR image owner — must match github.repository_owner (lowercase) of the
  # repository whose CI pushes images to ghcr.io/<owner>/springboot-pointofsale/...
  GHCR_OWNER: "mamangrust"
  APP_LOGGER: "production"
  SMTP_SERVER: "smtp.ethereal.email"
  SMTP_PORT: "587"

  KAFKA_BROKERS: "kafka.point-of-sale.svc.cluster.local:9092"

  # ClickHouse — OLAP engine for the stats pipeline (F3).
  # CLICKHOUSE_PASSWORD is injected from app-secrets, never stored here.
  CLICKHOUSE_ADDR: "clickhouse.point-of-sale.svc.cluster.local:9000"
  CLICKHOUSE_DATABASE: "pos"
  CLICKHOUSE_USERNAME: "dragon"

  REDIS_CLUSTER_ENABLED: "true"
  REDIS_CLUSTER_ENDPOINTS: "redis-cluster-0.redis-cluster-headless.point-of-sale.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.point-of-sale.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.point-of-sale.svc.cluster.local:6379,redis-cluster-3.redis-cluster-headless.point-of-sale.svc.cluster.local:6379,redis-cluster-4.redis-cluster-headless.point-of-sale.svc.cluster.local:6379,redis-cluster-5.redis-cluster-headless.point-of-sale.svc.cluster.local:6379"
  REDIS_HOST: "redis-cluster"
  REDIS_PORT: "6379"
  REDIS_DB_AUTH: "0"
  REDIS_DB_ROLE: "1"
  REDIS_DB_USER: "2"
  REDIS_DB_CATEGORY: "3"
  REDIS_DB_MERCHANT: "4"
  REDIS_DB_ORDER_ITEM: "5"
  REDIS_DB_ORDER: "6"
  REDIS_DB_PRODUCT: "7"
  REDIS_DB_TRANSACTION: "8"
  REDIS_DB_CART: "9"
  REDIS_DB_REVIEW: "10"
  REDIS_DB_SLIDER: "11"
  REDIS_DB_SHIPPING_ADDRESS: "12"
  REDIS_DB_BANNER: "13"
  REDIS_DB_MERCHANT_AWARD: "14"
  REDIS_DB_MERCHANT_BUSINESS: "15"
  REDIS_DB_MERCHANT_DETAIL: "16"
  REDIS_DB_MERCHANT_POLICY: "17"
  REDIS_DB_REVIEW_DETAIL: "18"

  OTEL_ENDPOINT: "otel-collector.point-of-sale.svc.cluster.local:4317"

  GRPC_CASHIER_ADDR: "cashier.point-of-sale.svc.cluster.local:9014"
  GRPC_CASHIER_PORT: "9014"
  GRPC_AUTH_ADDR: "auth.point-of-sale.svc.cluster.local:9012"
  GRPC_ROLE_ADDR: "role.point-of-sale.svc.cluster.local:9006"
  GRPC_USER_ADDR: "user.point-of-sale.svc.cluster.local:9011"
  GRPC_CATEGORY_ADDR: "category.point-of-sale.svc.cluster.local:9015"
  GRPC_MERCHANT_ADDR: "merchant.point-of-sale.svc.cluster.local:9005"
  GRPC_ORDER_ITEM_ADDR: "order-item.point-of-sale.svc.cluster.local:9016"
  # Dial key consumed by gateway/order/transaction/stats-writer adapters.
  GRPC_ORDERITEM_ADDR: "order-item.point-of-sale.svc.cluster.local:9016"
  GRPC_ORDER_ADDR: "order.point-of-sale.svc.cluster.local:9001"
  GRPC_PRODUCT_ADDR: "product.point-of-sale.svc.cluster.local:9003"
  GRPC_TRANSACTION_ADDR: "transaction.point-of-sale.svc.cluster.local:9009"
  # DIAL address used by gateway.
  GRPC_STATS_READER_ADDR: "stats-reader.point-of-sale.svc.cluster.local:9017"
  # LISTEN address used by stats-reader itself (must be a bind address).
  STATS_READER_LISTEN_ADDR: ":9017"

  GRPC_AUTH_PORT: "9012"
  GRPC_ROLE_PORT: "9006"
  GRPC_USER_PORT: "9011"
  GRPC_CATEGORY_PORT: "9015"
  GRPC_MERCHANT_PORT: "9005"
  GRPC_ORDER_ITEM_PORT: "9016"
  GRPC_ORDER_PORT: "9001"
  GRPC_PRODUCT_PORT: "9003"
  GRPC_TRANSACTION_PORT: "9009"
  GRPC_STATS_READER_PORT: "9017"

  METRIC_EMAIL_ADDR: "8080"
  METRIC_AUTH_ADDR: "8081"
  METRIC_ROLE_ADDR: "8082"
  METRIC_USER_ADDR: "8083"
  METRIC_CATEGORY_ADDR: "8084"
  METRIC_MERCHANT_ADDR: "8085"
  METRIC_ORDER_ITEM_ADDR: "8086"
  METRIC_ORDER_ADDR: "8087"
  METRIC_PRODUCT_ADDR: "8088"
  METRIC_TRANSACTION_ADDR: "8089"
  METRIC_CART_ADDR: "8090"
  METRIC_REVIEW_ADDR: "8091"
  METRIC_SLIDER_ADDR: "8092"
  METRIC_SHIPPING_ADDR: "8093"
  METRIC_BANNER_ADDR: "8094"
  METRIC_MERCHANT_AWARD_ADDR: "8095"
  METRIC_MERCHANT_BUSINESS_ADDR: "8096"
  METRIC_MERCHANT_DETAIL_ADDR: "8097"
  METRIC_MERCHANT_POLICY_ADDR: "8098"
  METRIC_REVIEW_DETAIL_ADDR: "8099"

  # ---- Spring Boot gRPC client resolution (gateway + inter-service calls) ----
  # gateway membaca grpc.client.<name>.host=${<NAME>_SERVICE_HOST:localhost}
  # (lihat gateway application.properties). Service DNS pakai hyphen (order-item).
  GATEWAY_PORT: "8080"
  EMAIL_HTTP_PORT: "8098"
  ROLE_SERVICE_HOST: "role.point-of-sale.svc.cluster.local"
  USER_SERVICE_HOST: "user.point-of-sale.svc.cluster.local"
  AUTH_SERVICE_HOST: "auth.point-of-sale.svc.cluster.local"
  MERCHANT_SERVICE_HOST: "merchant.point-of-sale.svc.cluster.local"
  CASHIER_SERVICE_HOST: "cashier.point-of-sale.svc.cluster.local"
  CATEGORY_SERVICE_HOST: "category.point-of-sale.svc.cluster.local"
  PRODUCT_SERVICE_HOST: "product.point-of-sale.svc.cluster.local"
  ORDER_SERVICE_HOST: "order.point-of-sale.svc.cluster.local"
  ORDER_ITEM_SERVICE_HOST: "order-item.point-of-sale.svc.cluster.local"
  TRANSACTION_SERVICE_HOST: "transaction.point-of-sale.svc.cluster.local"
  STATS_READER_SERVICE_HOST: "stats-reader.point-of-sale.svc.cluster.local"
