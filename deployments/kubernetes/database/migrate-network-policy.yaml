apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate-netpol
  namespace: point-of-sale
spec:
  # Job migrasi perlu menjangkau MongoDB di namespace yang sama.
  podSelector:
    matchLabels:
      app: migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: point-of-sale
    # DNS resolution for service names.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
