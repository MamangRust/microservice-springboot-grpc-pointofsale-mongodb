syntax = "proto3";

package pb.order_item;

import "order_item/order_item.proto";

option java_multiple_files = true;
option java_package = "com.sanedge.pointofsale.pb.order_item";

service OrderItemQueryService {
  rpc FindByOrder(FindByOrderOrderItemRequest) returns (ApiOrderItemsResponse) {}
  rpc FindById(FindByIdOrderItemRequest) returns (ApiResponseOrderItem) {}
}
