spring.application.name=db-migration
spring.data.mongodb.uri=mongodb://${DB_MIGRATE_HOST:mongo}:${DB_MIGRATE_PORT:27017}/${DB_MIGRATE_NAME:pos_identity}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}

# Mongock: track applied change units in this collection.
mongock.change-logs-collection-name=mongock_change_log
mongock.lock-collection-name=mongock_lock
# Fail fast so the compose job surfaces a non-zero exit on migration errors.
mongock.transaction-enabled=false

# Kafka email topology check. When true the runner opens a Kafka admin client
# and asserts every topic the POS modules publish to (and email-service reads)
# exists before declaring the schema provisioned. Left off by default so the
# migration still runs in environments where Kafka is not co-located.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
migration.topology.validate=${MIGRATION_VERIFY_TOPICS:false}

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
