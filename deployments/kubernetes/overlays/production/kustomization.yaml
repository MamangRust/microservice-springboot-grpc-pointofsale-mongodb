apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: point-of-sale

resources:
  - ../../core
  - ../../security
  - ../../database
  - ../../messaging
  - ../../cache
  - ../../observability
  - ../../networking
  - ../../services

images:
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/gateway
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/auth
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/cashier
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/category
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/db-migration
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/email
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/merchant
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/order
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/order_item
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/product
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/role
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/stats_reader
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/stats_writer
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/transaction
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e
  - name: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/user
    newTag: c5cc38c7e4e0f230684e94cce1d351ddf6f6225e

# GHCR image owner templating.
#
# The base manifests reference images as ghcr.io/__GHCR_OWNER__/springboot-pointofsale/<svc>.
# The `images` block above matches that placeholder (so newTag is pinned here),
# and this `replacements` block substitutes the real owner (from the app-config
# ConfigMap key GHCR_OWNER) into the <owner> segment of each image field.
# GHCR_OWNER must match github.repository_owner (lowercase) of the repository
# whose CI pushes to ghcr.io/<owner>/springboot-pointofsale/... — on a fork, only this
# ConfigMap value needs to change.
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.GHCR_OWNER
    targets:
      - select:
          kind: Deployment
          name: "^(gateway|auth|cashier|category|email|merchant|order|order-item|product|role|stats-reader|stats-writer|transaction|user)$"
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: Job
          name: "^(migrate|stats-backfill)$"
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: "/"
          index: 1

components:
  - ../../components/image-pull-secret

patches:
  - path: migration-hook.yaml
    target:
      group: batch
      version: v1
      kind: Job
      name: migrate
  - path: workload-wave.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(gateway|auth|cashier|category|email|merchant|order|order-item|product|role|stats-reader|stats-writer|transaction|user)$"
  - path: mongo-wave.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: "^mongo$"
