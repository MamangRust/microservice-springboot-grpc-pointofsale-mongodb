apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-reader
  namespace: point-of-sale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stats-reader
  template:
    metadata:
      labels:
        app: stats-reader
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB to be ready (TCP)..."
              until nc -z mongo.point-of-sale.svc.cluster.local 27017; do
                echo "MongoDB is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] MongoDB is accessible!"

        - name: wait-for-clickhouse
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for ClickHouse to be ready (TCP)..."
              until nc -z clickhouse.point-of-sale.svc.cluster.local 9000; do
                echo "ClickHouse is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] ClickHouse is ready!"
      containers:
        - name: stats-reader
          image: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/stats_reader:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 9017

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            tcpSocket:
              port: 9017
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9017
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 9017
            failureThreshold: 30
            periodSeconds: 10
