spring.application.name=order-item-service
spring.data.mongodb.uri=mongodb://${ORDER_ITEM_DB_HOST:localhost}:${ORDER_ITEM_DB_PORT:27017}/${ORDER_ITEM_DB_NAME:pos_sales}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9016

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
