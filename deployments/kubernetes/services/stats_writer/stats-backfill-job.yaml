apiVersion: batch/v1
kind: Job
metadata:
  name: stats-backfill
  namespace: point-of-sale
spec:
  # Manual job: apply it explicitly when historical OLTP rows need to be
  # materialized into ClickHouse. Re-running is safe — event ids are
  # deterministic per source row, so ClickHouse ReplacingMergeTree dedups.
  backoffLimit: 3
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-deps
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for source MongoDB (transaction) + ClickHouse..."
              # The backfill reads aggregated revenue directly from the transaction
              # MongoDB (not via gRPC services), so wait on those.
              until nc -z mongo.point-of-sale.svc.cluster.local 27017 \
                && nc -z clickhouse.point-of-sale.svc.cluster.local 9000; do
                echo "Dependencies not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] All dependencies are ready!"
      containers:
        - name: stats-backfill
          image: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/stats_writer:latest
          imagePullPolicy: IfNotPresent
          args: ["backfill"]
          env:
            # Run the embedded one-shot backfill (CommandLineRunner) instead of the
            # Kafka consumer; the app also disables the web stack in this mode.
            - name: APP_BACKFILL_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      restartPolicy: OnFailure
