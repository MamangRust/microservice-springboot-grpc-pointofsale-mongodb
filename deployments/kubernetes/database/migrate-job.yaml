apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: point-of-sale
spec:
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Tunggu MongoDB siap sebelum menjalankan migrasi Mongock.
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB..."
              until nc -z mongo.point-of-sale.svc.cluster.local 27017; do
                echo "MongoDB not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] MongoDB is ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: migrate
          image: ghcr.io/__GHCR_OWNER__/springboot-pointofsale/db-migration:latest
          workingDir: /app
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          imagePullPolicy: IfNotPresent
      restartPolicy: OnFailure
