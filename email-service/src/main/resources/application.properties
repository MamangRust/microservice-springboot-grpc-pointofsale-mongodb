spring.application.name=email-service
server.port=${EMAIL_HTTP_PORT:8098}

# ---- SMTP / Mailer (replaces quarkus.mailer.*) ----
spring.mail.host=${SMTP_SERVER:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@payment-gateway.com}

logging.level.com.sanedge=DEBUG

# ---- Kafka (replaces the Vert.x Kafka client config) ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
app.kafka.email.group-id=${KAFKA_EMAIL_GROUP_ID:email-service-group}
app.kafka.email.retry.group-id=${KAFKA_EMAIL_RETRY_GROUP_ID:email-service-retry-group}
# Mirrors the previous email.retry.max-attempts / email.retry.base-backoff-ms.
app.kafka.email.retry.max-attempts=${EMAIL_RETRY_MAX_ATTEMPTS:3}
app.kafka.email.retry.backoff-ms=${EMAIL_RETRY_BASE_BACKOFF_MS:30000}
app.kafka.email.lag.poll-ms=${KAFKA_EMAIL_LAG_POLL_MS:15000}
app.kafka.email.idempotency.lease-seconds=${EMAIL_IDEMPOTENCY_LEASE_SECONDS:60}
app.kafka.email.idempotency.ttl-seconds=${EMAIL_IDEMPOTENCY_TTL_SECONDS:86400}

# ---- Redis (replaces quarkus.redis.hosts) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:dragon_knight}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# ---- Dependency-aware health checks ----
# SMTP readiness probe is optional; enable when a reachable SMTP server is configured.
smtp.health.enabled=${SMTP_HEALTH_ENABLED:false}
smtp.health.timeout-ms=${SMTP_HEALTH_TIMEOUT_MS:3000}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Custom dependency probes (e.g. smtp) belong to the readiness group so that
# /actuator/health/readiness reflects them — parity with Quarkus /q/health/ready.
# Membership validation is off because the smtp probe only exists when
# smtp.health.enabled=true.
management.endpoint.health.group.readiness.include=readinessState,smtp
management.endpoint.health.validate-group-membership=false

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
