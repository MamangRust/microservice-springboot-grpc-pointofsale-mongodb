spring.application.name=stats-writer

# ---- MongoDB (backfill source: transaction context) ----
spring.data.mongodb.uri=mongodb://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT:27017}/${TRANSACTION_DB_NAME:pos_sales}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
app.kafka.stats.group-id=${KAFKA_STATS_GROUP_ID:stats-writer-group}

# ---- ClickHouse (write side) ----
clickhouse.url=${CLICKHOUSE_URL:jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:default}}
clickhouse.username=${CLICKHOUSE_USERNAME:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}

# ---- One-shot backfill (k8s Job runs this image with APP_BACKFILL_ENABLED=true) ----
app.backfill.enabled=${APP_BACKFILL_ENABLED:false}
# Backfill reads aggregated revenue from the source MongoDB (transaction context)
# via the standard spring.data.mongodb.uri below.

# ---- Observability ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.otlp.tracing.endpoint=http://localhost:4317
management.tracing.sampling.probability=1.0

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
