spring.application.name=category-service
spring.data.mongodb.uri=mongodb://${CATEGORY_DB_HOST:localhost}:${CATEGORY_DB_PORT:27017}/${CATEGORY_DB_NAME:pos_catalog}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9015

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
