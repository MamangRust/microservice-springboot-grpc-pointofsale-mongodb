spring.application.name=user-service
spring.data.mongodb.uri=mongodb://${USER_DB_HOST:localhost}:${USER_DB_PORT:27017}/${USER_DB_NAME:pos_identity}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9011

# gRPC client -> role service
grpc.client.role.host=${ROLE_SERVICE_HOST:localhost}
grpc.client.role.port=${ROLE_SERVICE_PORT:9006}

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
