syntax = "proto3";

package pb.order;

import "common/api.proto";

option java_multiple_files = true;
option java_package = "com.sanedge.pointofsale.pb.order";

message FindAllOrderRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message FindByMerchantOrderRequest {
  int32 merchant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string search = 4;
}

message FindByIdOrderRequest {
  int32 order_id = 1;
}

message CreateOrderItemRequest {
  int32 product_id = 1;
  int32 quantity = 2;
  int32 price = 3;
}

message CreateOrderRequest {
  int32 merchant_id = 1;
  int32 cashier_id = 2;
  repeated CreateOrderItemRequest items = 3;
}

message UpdateOrderItemRequest {
  int32 order_item_id = 1;
  int32 product_id = 2;
  int32 quantity = 3;
  int32 price = 4;
}

message UpdateOrderRequest {
  int32 order_id = 1;
  int32 cashier_id = 2;
  repeated UpdateOrderItemRequest items = 3;
}

message OrderResponse {
  int32 order_id = 1;
  int32 merchant_id = 2;
  int32 cashier_id = 3;
  int64 total_price = 4;
  string created_at = 5;
  string updated_at = 6;
}

message OrderResponseDeleteAt {
  int32 order_id = 1;
  int32 merchant_id = 2;
  int32 cashier_id = 3;
  int64 total_price = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
}

message OrderMonthlyResponse {
  string month = 1;
  int32 order_count = 2;
  int64 total_revenue = 3;
  int32 total_items_sold = 4;
}

message OrderYearlyResponse {
  string year = 1;
  int32 order_count = 2;
  int64 total_revenue = 3;
  int32 total_items_sold = 4;
  int32 active_cashiers = 5;
  int32 unique_products_sold = 6;
}

message OrderMonthlyTotalRevenueResponse {
  string year = 1;
  string month = 2;
  int64 total_revenue = 3;
}

message OrderYearlyTotalRevenueResponse {
  string year = 1;
  int64 total_revenue = 2;
}

message FindYearMonthOrder {
  int32 year_month = 1;
}

message FindYearMonthOrderByMerchant {
  int32 merchant_id = 1;
  int32 year_month = 2;
}

message FindYearOrder {
  int32 year = 1;
}

message FindYearOrderByMerchant {
  int32 merchant_id = 1;
  int32 year = 2;
}

message FindYearMonthTotalRevenue {
  int32 year = 1;
  int32 month = 2;
}

message FindYearMonthTotalRevenueByMerchant {
  int32 merchant_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message ApiResponseOrder {
  string status = 1;
  string message = 2;
  OrderResponse data = 3;
}

message ApiResponseOrderDeleteAt {
  string status = 1;
  string message = 2;
  OrderResponseDeleteAt data = 3;
}

message ApiResponseOrderAll {
  string status = 1;
  string message = 2;
  bool success = 3;
}

message ApiResponsePaginationOrder {
  string status = 1;
  string message = 2;
  repeated OrderResponse data = 3;
  pb.common.PaginationMeta pagination_meta = 4;
}

message ApiResponsePaginationOrderDeleteAt {
  string status = 1;
  string message = 2;
  repeated OrderResponseDeleteAt data = 3;
  pb.common.PaginationMeta pagination_meta = 4;
}

message ApiResponseOrderMonthly {
  string status = 1;
  string message = 2;
  repeated OrderMonthlyResponse data = 3;
}

message ApiResponseOrderYearly {
  string status = 1;
  string message = 2;
  repeated OrderYearlyResponse data = 3;
}

message ApiResponseOrderMonthlyTotalRevenue {
  string status = 1;
  string message = 2;
  repeated OrderMonthlyTotalRevenueResponse data = 3;
}

message ApiResponseOrderYearlyTotalRevenue {
  string status = 1;
  string message = 2;
  repeated OrderYearlyTotalRevenueResponse data = 3;
}
