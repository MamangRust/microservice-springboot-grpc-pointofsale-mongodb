apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: point-of-sale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pos-secrets
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # MongoDB instance berjalan tanpa auth di setup ini; tidak ada DB_USERNAME /
    # DB_PASSWORD. Host, port dan nama database tiap bounded context ada di
    # ConfigMap app-config (<MODULE>_DB_*), bukan di sini.
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: pos/GF_SECURITY_ADMIN_PASSWORD
    - secretKey: SECRET_KEY
      remoteRef:
        key: pos/SECRET_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: pos/REDIS_PASSWORD
    - secretKey: SMTP_USER
      remoteRef:
        key: pos/SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: pos/SMTP_PASS
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: pos/CLICKHOUSE_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: point-of-sale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pos-secrets
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: pos/GHCR_DOCKERCONFIGJSON
