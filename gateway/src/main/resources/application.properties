spring.application.name=gateway
server.port=${GATEWAY_PORT:8080}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}
spring.mvc.static-path-pattern=/static/
app.file.storage.mapping=/static

springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/api-docs/json
pointofsale.openapi.dev-url=${OPENAPI_DEV_URL:http://localhost:8080}
pointofsale.openapi.prod-url=${OPENAPI_PROD_URL:https://pointofsale.sanedge.com}

springjwt.app.jwtSecret=${JWT_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31}
springjwt.app.jwtRefreshSecret=${JWT_REFRESH_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32}
springjwt.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
springjwt.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:86400000}

grpc.client.auth.host=${AUTH_SERVICE_HOST:localhost}
grpc.client.auth.port=9012
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=9011
grpc.client.role.host=${ROLE_SERVICE_HOST:localhost}
grpc.client.role.port=9006
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=9005
grpc.client.cashier.host=${CASHIER_SERVICE_HOST:localhost}
grpc.client.cashier.port=9014
grpc.client.category.host=${CATEGORY_SERVICE_HOST:localhost}
grpc.client.category.port=9015
grpc.client.product.host=${PRODUCT_SERVICE_HOST:localhost}
grpc.client.product.port=9003
grpc.client.order.host=${ORDER_SERVICE_HOST:localhost}
grpc.client.order.port=9001
grpc.client.order-item.host=${ORDER_ITEM_SERVICE_HOST:localhost}
grpc.client.order-item.port=9016
grpc.client.transaction.host=${TRANSACTION_SERVICE_HOST:localhost}
grpc.client.transaction.port=9009

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
