syntax = "proto3";

package pb.transaction.stats;

import "transaction/transaction.proto";

option java_multiple_files = true;
option java_package = "com.sanedge.pointofsale.pb.transaction.stats";

service TransactionStatsMethodService {
  rpc FindMonthlyMethodSuccess(pb.transaction.FindYearMonthTransaction) returns (pb.transaction.ApiResponseTransactionMonthlyMethod) {}
  rpc FindYearlyMethodSuccess(pb.transaction.FindYearTransaction) returns (pb.transaction.ApiResponseTransactionYearlyMethod) {}
  rpc FindMonthlyMethodFailed(pb.transaction.FindYearMonthTransaction) returns (pb.transaction.ApiResponseTransactionMonthlyMethod) {}
  rpc FindYearlyMethodFailed(pb.transaction.FindYearTransaction) returns (pb.transaction.ApiResponseTransactionYearlyMethod) {}
  rpc FindMonthlyMethodSuccessByMerchant(pb.transaction.FindYearMonthTransactionByMerchant) returns (pb.transaction.ApiResponseTransactionMonthlyMethod) {}
  rpc FindYearlyMethodSuccessByMerchant(pb.transaction.FindYearTransactionByMerchant) returns (pb.transaction.ApiResponseTransactionYearlyMethod) {}
  rpc FindMonthlyMethodFailedByMerchant(pb.transaction.FindYearMonthTransactionByMerchant) returns (pb.transaction.ApiResponseTransactionMonthlyMethod) {}
  rpc FindYearlyMethodFailedByMerchant(pb.transaction.FindYearTransactionByMerchant) returns (pb.transaction.ApiResponseTransactionYearlyMethod) {}
}
