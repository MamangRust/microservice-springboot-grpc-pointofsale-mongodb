apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: point-of-sale
data:
  infrastructure-alerts.yaml: |
    groups:
      - name: infrastructure-alerts
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "Monitoring target {{ $labels.job }} is down"
              description: "Scrape target {{ $labels.job }} is unreachable."
          - alert: PrometheusSelfDown
            expr: up{job="prometheus"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "Prometheus is down"
              description: "Prometheus self-scrape failed."
          - alert: AlertmanagerDown
            expr: up{job="alertmanager"} == 0
            for: 1m
            labels: {severity: warning}
            annotations:
              summary: "Alertmanager is down"
              description: "Alertmanager is unreachable."
  application-alerts.yaml: |
    groups:
      - name: application-alerts
        rules:
          - alert: HighErrorRate
            expr: |
              sum by (service_name) (rate(golang_app_errors_total[5m]))
              / clamp_min(sum by (service_name) (rate(golang_app_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "High error rate on {{ $labels.service_name }}"
              description: "More than 5% of requests are failing for 5 minutes."
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, sum by (le, service_name) (rate(golang_app_request_duration_seconds_bucket[5m]))) > 1
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "High latency on {{ $labels.service_name }}"
              description: "P95 latency exceeded one second for 5 minutes."
  financial-slo-alerts.yaml: |
    groups:
      - name: financial-slo-alerts
        rules:
          - alert: FinancialCommandErrorBudgetFastBurn
            expr: |
              sum(rate(golang_app_errors_total{service_name=~"order-service|transaction-service"}[5m]))
              / sum(rate(golang_app_requests_total{service_name=~"order-service|transaction-service"}[5m])) > 0.0014
            for: 2h
            labels: {severity: critical, service: financial_commands}
            annotations:
              summary: "Financial command error budget burning fast"
              description: "Error rate above 0.14% sustained for 2h on order/transaction commands."
          - alert: FinancialCommandErrorBudgetSlowBurn
            expr: |
              sum(rate(golang_app_errors_total{service_name=~"order-service|transaction-service"}[30m]))
              / sum(rate(golang_app_requests_total{service_name=~"order-service|transaction-service"}[30m])) > 0.0006
            for: 5h
            labels: {severity: warning, service: financial_commands}
            annotations:
              summary: "Financial command error budget burning slow"
              description: "Error rate above 0.06% sustained for 5h on order/transaction commands."
          - alert: FinancialCommandP99Latency
            expr: |
              histogram_quantile(0.99, sum by (le) (rate(golang_app_request_duration_seconds_bucket{service_name=~"order-service|transaction-service"}[5m]))) > 1
            for: 10m
            labels: {severity: warning, service: financial_commands}
            annotations:
              summary: "Financial command p99 latency above 1s"
              description: "p99 latency of order/transaction commands exceeds 1s for 10 minutes."
          - alert: OutboxLagGrowing
            expr: sum(golang_app_outbox_events_pending) > 500
            for: 15m
            labels: {severity: warning, service: outbox}
            annotations:
              summary: "Outbox backlog is growing"
              description: "More than 500 outbox events waiting for delivery for 15 minutes."
          - alert: OutboxStaleEvents
            expr: sum(increase(golang_app_outbox_events_failed_total[15m])) > 100
            for: 15m
            labels: {severity: warning, service: outbox}
            annotations:
              summary: "Outbox publisher failing to deliver events"
              description: "More than 100 outbox events failed to publish in 15 minutes."
  mongodb-alerts.yaml: |
    groups:
      - name: mongodb-alerts
        rules:
          - alert: MongoDown
            expr: mongodb_up == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "MongoDB is down"
              description: "MongoDB is unreachable."
          - alert: MongoHighConnections
            expr: mongodb_connections{state="current"} > 200
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "High MongoDB connection count"
              description: "MongoDB exceeds 200 open connections."
          - alert: MongoExporterScrapeError
            expr: mongodb_exporter_last_scrape_error > 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "MongoDB exporter scrape error"
              description: "MongoDB exporter cannot scrape database metrics."
  kafka-alerts.yaml: |
    groups:
      - name: kafka-alerts
        rules:
          - alert: KafkaConsumerGroupHighLag
            expr: max by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "High Kafka consumer lag"
              description: "A Kafka consumer group is more than 1000 messages behind."
          - alert: KafkaConsumerGroupCriticalLag
            expr: max by (consumergroup, topic) (kafka_consumergroup_lag) > 10000
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Critical Kafka consumer lag"
              description: "A Kafka consumer group is more than 10000 messages behind."
          - alert: KafkaExporterDown
            expr: up{job="kafka-exporter"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "Kafka exporter is down"
              description: "Kafka metrics are unavailable."
  node-exporter-alerts.yaml: |
    groups:
      - name: node-exporter-alerts
        rules:
          - alert: HighCpuUsage
            expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: "High CPU usage on {{ $labels.instance }}"
              description: "CPU usage is above 90%."
          - alert: HighMemoryUsage
            expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: "High memory usage on {{ $labels.instance }}"
              description: "Memory usage is above 90%."
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "Node exporter is down"
              description: "Node exporter is unreachable."
