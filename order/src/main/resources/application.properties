spring.application.name=order-service
spring.data.mongodb.uri=mongodb://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:27017}/${ORDER_DB_NAME:pos_sales}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9001

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9005}

# gRPC client -> cashier service
grpc.client.cashier.host=${CASHIER_SERVICE_HOST:localhost}
grpc.client.cashier.port=${CASHIER_SERVICE_PORT:9014}

# gRPC client -> product service
grpc.client.product.host=${PRODUCT_SERVICE_HOST:localhost}
grpc.client.product.port=${PRODUCT_SERVICE_PORT:9003}

# gRPC client -> order-item service
grpc.client.order-item.host=${ORDER_ITEM_SERVICE_HOST:localhost}
grpc.client.order-item.port=${ORDER_ITEM_SERVICE_PORT:9016}

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Relay mem-publish hanya domain milik service ini; domain lain di database yang
# sama (mis. pos_sales dipakai order + order-item + transaction) ditulis service
# pemiliknya.
outbox.publisher.enabled=true
outbox.publisher.domains=ORDER,ORDER_ITEM
outbox.publisher.batch-size=50
outbox.publisher.lease-seconds=300
outbox.publisher.max-attempts=5
outbox.publisher.retry-delay-seconds=30
