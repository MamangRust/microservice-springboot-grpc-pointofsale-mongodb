syntax = "proto3";

package pb.category;

import "common/api.proto";

option java_multiple_files = true;
option java_package = "com.sanedge.pointofsale.pb.category";

message FindAllCategoryRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message FindByIdCategoryRequest {
  int32 category_id = 1;
}

message CategoryResponse {
  int32 category_id = 1;
  string name = 2;
  string description = 3;
  string slug_category = 4;
  string created_at = 5;
  string updated_at = 6;
}

message CategoryResponseDeleteAt {
  int32 category_id = 1;
  string name = 2;
  string description = 3;
  string slug_category = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
}

message CreateCategoryRequest {
  string name = 1;
  string description = 2;
  string slug_category = 3;
}

message UpdateCategoryRequest {
  int32 category_id = 1;
  string name = 2;
  string description = 3;
  string slug_category = 4;
}

message CategoryMonthPriceResponse {
  string month = 1;
  int32 category_id = 2;
  string category_name = 3;
  int32 order_count = 4;
  int32 items_sold = 5;
  int64 total_revenue = 6;
}

message CategoryYearPriceResponse {
  string year = 1;
  int32 category_id = 2;
  string category_name = 3;
  int32 order_count = 4;
  int32 items_sold = 5;
  int64 total_revenue = 6;
  int32 unique_products_sold = 7;
}

message CategoryMonthTotalPriceResponse {
  string year = 1;
  string month = 2;
  int64 total_revenue = 3;
}

message CategoryYearTotalPriceResponse {
  string year = 1;
  int64 total_revenue = 2;
}

message FindYearCategory {
  int32 year = 1;
}

message FindYearCategoryById {
  int32 category_id = 1;
  int32 year = 2;
}

message FindYearCategoryByMerchant {
  int32 merchant_id = 1;
  int32 year = 2;
}

message FindYearMonthTotalPrice {
  int32 year = 1;
  int32 month = 2;
}

message FindYearMonthTotalPriceById {
  int32 category_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message FindYearMonthTotalPriceByMerchant {
  int32 merchant_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message FindYearTotalPrice {
  int32 year = 1;
}

message FindYearTotalPriceById {
  int32 category_id = 1;
  int32 year = 2;
}

message FindYearTotalPriceByMerchant {
  int32 merchant_id = 1;
  int32 year = 2;
}

message ApiResponseCategory {
  string status = 1;
  string message = 2;
  CategoryResponse data = 3;
}

message ApiResponseCategoryDeleteAt {
  string status = 1;
  string message = 2;
  CategoryResponseDeleteAt data = 3;
}

message ApiResponseCategoryAll {
  string status = 1;
  string message = 2;
  bool success = 3;
}

message ApiResponsePaginationCategory {
  string status = 1;
  string message = 2;
  repeated CategoryResponse data = 3;
  pb.common.PaginationMeta pagination_meta = 4;
}

message ApiResponsePaginationCategoryDeleteAt {
  string status = 1;
  string message = 2;
  repeated CategoryResponseDeleteAt data = 3;
  pb.common.PaginationMeta pagination_meta = 4;
}

message ApiResponseCategoryMonthPrice {
  string status = 1;
  string message = 2;
  repeated CategoryMonthPriceResponse data = 3;
}

message ApiResponseCategoryYearPrice {
  string status = 1;
  string message = 2;
  repeated CategoryYearPriceResponse data = 3;
}

message ApiResponseCategoryMonthTotalPrice {
  string status = 1;
  string message = 2;
  repeated CategoryMonthTotalPriceResponse data = 3;
}

message ApiResponseCategoryYearTotalPrice {
  string status = 1;
  string message = 2;
  repeated CategoryYearTotalPriceResponse data = 3;
}
