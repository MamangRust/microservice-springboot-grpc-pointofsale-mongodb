syntax = "proto3";

package pb.user;

import "common/api.proto";

option java_multiple_files = true;
option java_package = "com.sanedge.pointofsale.pb.user";

message FindAllUserRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message FindByIdUserRequest {
  int32 id = 1;
}

message FindByEmailUserRequest {
  string email = 1;
}

message FindByUsernameUserRequest {
  string username = 1;
}

message UserResponse {
  int32 id = 1;
  string username = 2;
  string firstname = 3;
  string lastname = 4;
  string email = 5;
  string created_at = 6;
  string updated_at = 7;
}

message UserResponseDeleteAt {
  int32 id = 1;
  string firstname = 2;
  string lastname = 3;
  string email = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
}

message ApiResponseUser {
  string status = 1;
  string message = 2;
  UserResponse data = 3;
}

message ApiResponseUserDeleteAt {
  string status = 1;
  string message = 2;
  UserResponseDeleteAt data = 3;
}

message ApiResponseUserAll {
  string status = 1;
  string message = 2;
  bool success = 3;
}

message ApiResponsePaginationUser {
  string status = 1;
  string message = 2;
  repeated UserResponse data = 3;
  pb.common.PaginationMeta pagination_meta = 4;
}

message ApiResponsePaginationUserDeleteAt {
  string status = 1;
  string message = 2;
  repeated UserResponseDeleteAt data = 3;
  pb.common.PaginationMeta pagination_meta = 4;
}
