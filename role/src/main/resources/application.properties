spring.application.name=role-service
spring.data.mongodb.uri=mongodb://${ROLE_DB_HOST:localhost}:${ROLE_DB_PORT:27017}/${ROLE_DB_NAME:pos_identity}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9006

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
