spring.application.name=auth-service
spring.data.mongodb.uri=mongodb://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:27017}/${AUTH_DB_NAME:pos_identity}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9012

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9011}

# gRPC client -> role service
grpc.client.role.host=${ROLE_SERVICE_HOST:localhost}
grpc.client.role.port=${ROLE_SERVICE_PORT:9006}

# JWT
springjwt.app.jwtSecret=${JWT_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31}
springjwt.app.jwtRefreshSecret=${JWT_REFRESH_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32}
springjwt.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
springjwt.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:86400000}

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Relay mem-publish hanya domain milik service ini; domain lain di database yang
# sama (mis. pos_sales dipakai order + order-item + transaction) ditulis service
# pemiliknya.
outbox.publisher.enabled=true
outbox.publisher.domains=USER
outbox.publisher.batch-size=50
outbox.publisher.lease-seconds=300
outbox.publisher.max-attempts=5
outbox.publisher.retry-delay-seconds=30
