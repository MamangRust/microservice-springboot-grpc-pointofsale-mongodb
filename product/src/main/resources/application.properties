spring.application.name=product-service
spring.data.mongodb.uri=mongodb://${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:27017}/${PRODUCT_DB_NAME:pos_catalog}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9003

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9005}

# gRPC client -> category service
grpc.client.category.host=${CATEGORY_SERVICE_HOST:localhost}
grpc.client.category.port=${CATEGORY_SERVICE_PORT:9015}

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Service ini tidak menulis event outbox, jadi relay dimatikan (database-nya
# dipakai bersama dengan service pemilik event).
outbox.publisher.enabled=false
