# Test-only configuration.
#
# Kafka and Redis endpoints are supplied per-test via Testcontainers
# (AbstractKafkaRedisIT / the standalone IT classes), so the container-side
# defaults here are only fallbacks. Tests that need a *closed* Redis point
# spring.data.redis.port at an unused port to exercise the fail-open path.
spring.kafka.bootstrap-servers=localhost:9092

# Never let an accidental real send escape during tests.
app.mail.from=no-reply@example.test

# Random HTTP port per Spring Boot test context so multiple IT classes can
# share one Surefire JVM without 'Port already bound' conflicts.
server.port=0

# Readiness group must include the custom smtp probe (Spring Boot does not add
# arbitrary HealthIndicator beans to the readiness group automatically). The
# probe only exists when smtp.health.enabled=true, so membership validation is
# disabled to keep contexts without the probe valid.
management.endpoint.health.group.readiness.include=readinessState,smtp
management.endpoint.health.validate-group-membership=false
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
