syntax = "proto3";

package pb.category;

import "google/protobuf/empty.proto";

import "category/category.proto";

option java_multiple_files = true;
option java_package = "com.sanedge.pointofsale.pb.category";

service CategoryCommandService {
  rpc CreateCategory(CreateCategoryRequest) returns (ApiResponseCategory) {}
  rpc UpdateCategory(UpdateCategoryRequest) returns (ApiResponseCategory) {}
  rpc TrashedCategory(FindByIdCategoryRequest) returns (ApiResponseCategoryDeleteAt) {}
  rpc RestoreCategory(FindByIdCategoryRequest) returns (ApiResponseCategoryDeleteAt) {}
  rpc DeleteCategoryPermanent(FindByIdCategoryRequest) returns (ApiResponseCategoryAll) {}
  rpc RestoreAllCategory(google.protobuf.Empty) returns (ApiResponseCategoryAll) {}
  rpc DeleteAllCategoryPermanent(google.protobuf.Empty) returns (ApiResponseCategoryAll) {}
}
